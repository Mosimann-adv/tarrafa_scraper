name: Sugerir uma melhoria
description: Proponha uma melhoria de produto ou uma nova fonte pública.
title: "[Melhoria]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: A sugestão não contém dados pessoais, material de caso ou segredo.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que dificuldade genérica esta mudança resolveria?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva a interface ou o comportamento desejado.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
