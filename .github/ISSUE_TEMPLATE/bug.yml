name: Relatar um bug
description: Informe um problema reproduzível usando apenas dados sintéticos ou públicos.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo relato. Não publique dados de caso, documentos de autos,
        CPF, cookies, tokens, `.env` ou `storage_state.json`.

  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmações de privacidade
      options:
        - label: O relato não contém dados pessoais, material de caso ou segredo.
          required: true
        - label: A reprodução usa fixture sintética ou URL pública não sensível.
          required: true
        - label: Procurei issues existentes antes de abrir esta.
          required: true

  - type: dropdown
    id: tool
    attributes:
      label: Tool afetada
      options:
        - init / configuração
        - page
        - site
        - feed
        - shot
        - video
        - album
        - dossier
        - ig
        - cnpj
        - djen
        - datajud
        - pdf-extract
        - doctor / CLI geral
        - outra
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versão e ambiente
      description: Saída resumida de `tarrafa version`, Python e sistema operacional.
      placeholder: "tarrafa 0.4.0 · Python 3.14 · Windows 11"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Use caminhos e valores sintéticos.
      placeholder: |
        1. Executei `tarrafa ...`
        2. Com a URL pública `https://example.com`
        3. O comando retornou...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
      description: Cole somente logs sanitizados.
    validations:
      required: true
