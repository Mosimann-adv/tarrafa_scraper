[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tarrafa-scraper"
dynamic = ["version"]
description = "Tarrafa — multi-source CLI for open-web capture and legal inventory (page, site, feed, shot, video, IG, CNPJ, DJEN, Datajud, PDF)."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
  { name = "Mosimann Advocacia", email = "mosimannadv@gmail.com" },
  { name = "Tarrafa contributors" },
]
keywords = ["scraper", "instagram", "playwright", "tarrafa", "rss", "crawl", "screenshot", "video", "pdf", "cnpj", "djen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Legal Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
]
dependencies = [
  "playwright>=1.40.0,<2",
  "httpx>=0.27.0,<1",
  "trafilatura>=1.6.0,<3",
  "feedparser>=6.0.0,<7",
  "pypdf>=4.0.0,<7",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = [
  "httpx>=0.27.0,<1",
  "trafilatura>=1.6.0,<3",
  "feedparser>=6.0.0,<7",
]
av = ["yt-dlp>=2024.1.0"]
site = ["scrapy>=2.11.0,<3"]
dev = [
  "build>=1.2,<2",
  "pytest>=7.0",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]
all = [
  "httpx>=0.27.0,<1",
  "trafilatura>=1.6.0,<3",
  "feedparser>=6.0.0,<7",
  "scrapy>=2.11.0,<3",
  "yt-dlp>=2024.1.0",
  "build>=1.2,<2",
  "pytest>=7.0",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/Mosimann-adv/tarrafa_scraper"
Repository = "https://github.com/Mosimann-adv/tarrafa_scraper.git"
Documentation = "https://github.com/Mosimann-adv/tarrafa_scraper#readme"
Changelog = "https://github.com/Mosimann-adv/tarrafa_scraper/blob/main/CHANGELOG.md"
Issues = "https://github.com/Mosimann-adv/tarrafa_scraper/issues"
Security = "https://github.com/Mosimann-adv/tarrafa_scraper/security/policy"

[project.scripts]
tarrafa = "tarrafa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tarrafa = ["skills/*.tmpl"]

[tool.setuptools.dynamic]
version = { attr = "tarrafa.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
  "integration: live network and browser checks",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
