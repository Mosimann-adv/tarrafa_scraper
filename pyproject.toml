[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tarrafa-scraper"
version = "0.4.0"
description = "Tarrafa — multi-source CLI for open-web capture and legal inventory (page, site, feed, shot, video, IG, CNPJ, DJEN, Datajud, PDF)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Mosimann Advocacia" }, { name = "Tarrafa contributors" }]
keywords = ["scraper", "instagram", "playwright", "tarrafa", "rss", "crawl", "screenshot", "video", "pdf", "cnpj", "djen"]
dependencies = [
  "playwright>=1.40.0,<2",
  "httpx>=0.27.0,<1",
  "trafilatura>=1.6.0,<3",
  "feedparser>=6.0.0,<7",
  "pypdf>=4.0.0,<7",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = [
  "httpx>=0.27.0,<1",
  "trafilatura>=1.6.0,<3",
  "feedparser>=6.0.0,<7",
]
av = ["yt-dlp>=2024.1.0"]
site = ["scrapy>=2.11.0,<3"]
dev = [
  "pytest>=7.0",
  "ruff>=0.12,<1",
]
all = [
  "httpx>=0.27.0,<1",
  "trafilatura>=1.6.0,<3",
  "feedparser>=6.0.0,<7",
  "scrapy>=2.11.0,<3",
  "yt-dlp>=2024.1.0",
  "pytest>=7.0",
  "ruff>=0.12,<1",
]

[project.scripts]
tarrafa = "tarrafa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
  "integration: live network and browser checks",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
